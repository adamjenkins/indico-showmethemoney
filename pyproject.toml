[project]
name = 'indico-plugin-showmethemoney'
description = 'Withholds registrant-only menu entries until the registration fee is paid'
readme = 'README.md'
version = '0.1.0'
license = 'MIT'
authors = [
    { name = 'Adam Jenkins' },
]
requires-python = '>=3.12.2, <3.13'
dependencies = ['indico>=3.3']

[project.entry-points.'indico.plugins']
showmethemoney = 'indico_showmethemoney.plugin:ShowmethemoneyPlugin'

[build-system]
requires = ['hatchling==1.28.0']
build-backend = 'hatchling.build'

[tool.hatch.build]
packages = ['indico_showmethemoney']
exclude = [
    '*.no-header',
    '.keep',
    'tests/',
    '*_test.py',
]
artifacts = [
    'indico_*/translations/**/*.mo',
]
